version: 1
engine:
  action_budget: 5
  max_counterwitness_predicates: 14
  memory_tokens: 32000
  chars_per_token: 4.0
  min_reliability: 0.7
  evidence_max_age_days: 120
  retry_delay_days: 1
  poll_interval_days: 7
  max_history_records: 300
  max_coverage_records: 300
  max_trace_records: 1000
  action_costs:
    resolve: 1.0
    fetch: 1.0
  risk:
    suspension_penalty: 0.25
    wrong_decision_loss: 1.0
  hazard:
    kappa_days: 56
    default_prior_per_day: 0.01
    category_priors_per_day: {}
    trigger_alpha: 1.0
    trigger_beta: 1.0
    access_alpha: 1.0
    access_beta: 1.0
    cold_start_access_probability: 0.9
  scheduler:
    mode: positive_only
    beta: 0.5
    epsilon: 0.000001
    lambda_access: 0.002
    lambda_cost: 0.001
    minimum_score: 0.0
    prior_true: 0.5
    max_exact_variables: 12
    monte_carlo_samples: 512
    seed: 37
  http:
    timeout_seconds: 10
    max_response_bytes: 1048576
    max_redirects: 5
    user_agent: ProofWatch/0.1
    allowed_schemes:
      - https
      - http
    headers: {}
